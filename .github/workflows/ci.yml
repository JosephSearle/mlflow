name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prompts:
    name: Validate prompts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt
      - run: python ops/scripts/validate_prompts.py

  validate-gateway:
    name: Validate AI Gateway configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt
      - run: python ops/scripts/validate_gateway.py

  validate-eval-datasets:
    name: Validate eval datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt
      - run: python ops/scripts/validate_eval_datasets.py

  docker-build:
    name: Build server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile.vercel -t mlflow-server:ci server

  sync-integration:
    name: Sync scripts against a live server
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt
      - name: Create minimal .env for CI (auth disabled - no real Auth0 tenant here)
        run: echo "AUTH_DISABLED=true" > .env
      - name: Start local Postgres + MLflow server
        run: docker compose up -d --build
      - name: Wait for MLflow to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health >/dev/null; then
              echo "MLflow is up"
              exit 0
            fi
            sleep 2
          done
          echo "MLflow did not become healthy in time"
          docker compose logs
          exit 1
      - name: Sync prompts (apply, then confirm idempotent)
        env:
          MLFLOW_TRACKING_URI: http://localhost:5001
        run: |
          python ops/scripts/sync_prompts.py --apply
          python ops/scripts/sync_prompts.py --check
      - name: Sync eval datasets (apply, then confirm idempotent)
        env:
          MLFLOW_TRACKING_URI: http://localhost:5001
        run: |
          python ops/scripts/sync_eval_datasets.py --apply
          python ops/scripts/sync_eval_datasets.py --check
      - name: Render AI Gateway config (check only - no real provider keys in CI)
        run: python ops/scripts/sync_gateway.py --apply
      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install detect-secrets
      - name: Scan for new/unaudited secrets
        run: |
          detect-secrets scan \
            --exclude-files '\.git/' \
            --exclude-files 'ops/gateway/rendered_config\.yaml' \
            --baseline .secrets.baseline
          # `scan` always rewrites generated_at, so ignore that field when
          # deciding whether the results actually changed.
          jq 'del(.generated_at)' .secrets.baseline > /tmp/after.json
          git show HEAD:.secrets.baseline | jq 'del(.generated_at)' > /tmp/before.json
          diff /tmp/before.json /tmp/after.json
