_subdirectory: template
_templates_suffix: ".jinja"
_answers_file: ".copier-answers.{{ name }}.yml"

name:
  type: str
  help: "Prompt name (lowercase_snake_case, must be unique - becomes the filename and the MLflow Prompt Registry name)"
  validator: >-
    {% if not (name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Name must be lowercase snake_case, starting with a letter (e.g. summarize_ticket)
    {% endif %}

team:
  type: str
  help: "Owning team (stored as a tag)"
  default: support

owner_email:
  type: str
  help: "Owner email (stored as a tag)"
  default: josephwilliamsearle@gmail.com

commit_message:
  type: str
  help: "Commit message for this prompt's first version"
  default: Initial version
